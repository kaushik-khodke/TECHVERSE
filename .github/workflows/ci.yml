name: MyHealthChain CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: testing
          GEMINI_API_KEY: "AIzaSyDummyTestKeyForCIBuild123456789"
          STRIPE_SECRET_KEY: "sk_test_mock_stripe_key_for_ci_12345"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock-supabase-key"
          SUPABASE_SERVICE_ROLE_KEY: "mock-supabase-service-role-key"
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
